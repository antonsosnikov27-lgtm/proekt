<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Сегодня</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:#1a1b20;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

/* ОСНОВНОЙ ЭКРАН */

.app{
    width:100%;
    max-width:430px;
    height:100vh;
    background:#111216;
    position:relative;
    overflow:hidden;
    border-left:1px solid #22242b;
    border-right:1px solid #22242b;
}

/* HEADER */

.header{
    height:120px;
    padding:28px 26px 0;
    border-bottom:1px solid #262831;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.title{
    color:white;
    font-size:58px;
    font-weight:700;
    letter-spacing:-2px;
    line-height:1;
}

.menu{
    color:#5f6168;
    font-size:44px;
    line-height:1;
    margin-top:4px;
    user-select:none;
    cursor:pointer;
}

/* CONTENT */

.content{
    padding:28px 24px;
}

.date{
    color:#d8d8d8;
    font-size:20px;
    font-weight:500;
    margin-bottom:38px;
}

.task{
    display:flex;
    align-items:center;
    gap:18px;
}

.circle{
    width:36px;
    height:36px;
    border:3px solid #d9d9d9;
    border-radius:50%;
    flex-shrink:0;
}

.task input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:24px;
    font-weight:400;
}

.task input::placeholder{
    color:#76787f;
}

.line{
    width:calc(100% - 62px);
    height:1px;
    background:#2b2d33;
    margin-left:62px;
    margin-top:16px;
}

/* ПЛЮС */

.add-btn{
    position:absolute;
    right:28px;
    bottom:112px;

    width:78px;
    height:78px;

    border:none;
    border-radius:50%;

    background:linear-gradient(135deg,#0a84ff,#7c4dff);

    color:white;
    font-size:58px;
    font-weight:200;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-bottom:6px;

    box-shadow:0 0 30px rgba(90,90,255,.25);

    cursor:pointer;
}

/* BOTTOM NAV */

.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:92px;

    background:#111216;
    border-top:1px solid #22242b;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;

    color:#76787f;
    font-size:14px;
    font-weight:500;
}

.nav-item .icon{
    font-size:30px;
    line-height:1;
}

.nav-item.active{
    color:#4d6fff;
}

/* АДАПТАЦИЯ ПОД ТЕЛЕФОН */

@media (max-width:480px){

    .header{
        height:92px;
        padding:24px 18px 0;
    }

    .title{
        font-size:36px;
    }

    .menu{
        font-size:34px;
    }

    .content{
        padding:24px 18px;
    }

    .date{
        font-size:16px;
        margin-bottom:28px;
    }

    .circle{
        width:28px;
        height:28px;
        border-width:2px;
    }

    .task{
        gap:14px;
    }

    .task input{
        font-size:18px;
    }

    .line{
        width:calc(100% - 42px);
        margin-left:42px;
        margin-top:14px;
    }

    .bottom-nav{
        height:82px;
    }

    .nav-item{
        font-size:11px;
    }

    .nav-item .icon{
        font-size:24px;
    }

    .add-btn{
        width:66px;
        height:66px;
        right:20px;
        bottom:96px;
        font-size:48px;
    }
}

/* ПК */

@media (min-width:900px){

    body{
        padding:30px;
    }

    .app{
        height:920px;
        border-radius:26px;
        box-shadow:0 20px 60px rgba(0,0,0,.55);
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            Сегодня
        </div>

        <div class="menu">
            ☰
        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <div class="date">
            14 мая • Четверг
        </div>

        <div class="task">

            <div class="circle"></div>

            <input type="text" placeholder="Текст">

        </div>

        <div class="line"></div>

    </div>

    <!-- BUTTON -->

    <button class="add-btn">
        +
    </button>

    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <div class="nav-item">

            <div class="icon">🗓</div>

            <div>Входящие</div>

        </div>

        <div class="nav-item active">

            <div class="icon">▣</div>

            <div>Сегодня</div>

        </div>

        <div class="nav-item">

            <div class="icon">✧</div>

            <div>Привычки</div>

        </div>

        <div class="nav-item">

            <div class="icon">▤</div>

            <div>Расписание</div>

        </div>

    </div>

</div>

</body>
</html>
