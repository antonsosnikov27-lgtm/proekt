<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Today UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#2c2c2c;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* ========================= */
/* ОСНОВНОЙ КОНТЕЙНЕР */
/* ========================= */

.phone{
    width:100%;
    max-width:430px;
    height:920px;
    background:#111217;
    border:1px solid #3a3a3a;
    overflow:hidden;
    position:relative;
    color:white;
    border-radius:0;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

/* ========================= */
/* HEADER */
/* ========================= */

.header{
    padding:28px 22px 20px;
    border-bottom:1px solid #333;
    background:linear-gradient(to bottom,#17181e,#121319);
}

.header h1{
    font-size:56px;
    font-weight:700;
    letter-spacing:-2px;
}

/* ========================= */
/* CONTENT */
/* ========================= */

.content{
    padding:20px;
    position:relative;
    height:calc(100% - 120px);
}

.date{
    font-size:18px;
    color:#fff;
    margin-bottom:30px;
}

.task{
    display:flex;
    align-items:center;
    gap:12px;
}

.circle{
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid #a8a8a8;
}

.task span{
    color:#d7d7d7;
    font-size:20px;
}

.line{
    margin-top:14px;
    margin-left:18px;
    width:calc(100% - 36px);
    height:1px;
    background:#343434;
}

/* ========================= */
/* НИЖНЯЯ ПАНЕЛЬ */
/* ========================= */

.bottom{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:42%;
    background:linear-gradient(180deg,#232325,#1a1a1d);
    border-top-left-radius:28px;
    border-top-right-radius:28px;
    overflow:hidden;
}

/* градиентная обводка */

.bottom::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px 28px 0 0;
    padding:1.2px;
    background:linear-gradient(90deg,#0077ff,#cc4cff);
    
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

.bottom-content{
    position:relative;
    padding:26px 20px;
    height:100%;
}

.task-name{
    font-size:17px;
    color:#8c8c8c;
    margin-bottom:16px;
}

.desc{
    font-size:16px;
    color:#757575;
    margin-bottom:24px;
}

.tags{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.tag{
    border:1px solid #747474;
    color:#ddd;
    padding:7px 14px;
    border-radius:8px;
    font-size:15px;
    background:rgba(255,255,255,0.02);
}

/* ========================= */
/* КНОПКИ */
/* ========================= */

.mic{
    position:absolute;
    right:18px;
    top:108px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#3f8cff,#8d44ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    box-shadow:0 0 20px rgba(114,89,255,.4);
}

.send{
    position:absolute;
    right:18px;
    bottom:108px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(135deg,#1f9cff,#7d48ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    box-shadow:0 0 25px rgba(108,89,255,.5);
}

/* ========================= */
/* NAVBAR */
/* ========================= */

.navbar{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:90px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:#7f7f88;
    font-size:12px;
}

.nav-item.active{
    color:#376cff;
}

.icon{
    width:28px;
    height:28px;
    border:2px solid currentColor;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

/* ========================= */
/* АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНА */
/* ========================= */

@media (max-width:768px){

    body{
        padding:0;
        background:#111217;
    }

    .phone{
        max-width:100%;
        width:100%;
        height:100vh;
        border:none;
    }

    .header h1{
        font-size:42px;
    }

    .date{
        font-size:17px;
    }

    .task span{
        font-size:18px;
    }

    .bottom{
        height:45%;
    }
}

/* ========================= */
/* АДАПТАЦИЯ ДЛЯ ПК */
/* ========================= */

@media (min-width:769px){

    body{
        padding:40px;
    }

    .phone{
        max-width:520px;
        height:960px;
        border-radius:18px;
    }

    .header h1{
        font-size:62px;
    }

    .date{
        font-size:22px;
    }

    .task span{
        font-size:22px;
    }

    .task-name{
        font-size:30px;
    }

    .desc{
        font-size:22px;
    }

    .tag{
        font-size:16px;
        padding:10px 18px;
    }

    .mic{
        width:48px;
        height:48px;
    }

    .send{
        width:64px;
        height:64px;
    }
}

</style>
</head>

<body>

<div class="phone">

    <div class="header">
        <h1>Сегодня</h1>
    </div>

    <div class="content">

        <div class="date">14 мая • Четверг</div>

        <div class="task">
            <div class="circle"></div>
            <span>Текст</span>
        </div>

        <div class="line"></div>

        <div class="bottom">

            <div class="bottom-content">

                <div class="task-name">Название задачи</div>

                <div class="desc">Описание</div>

                <div class="tags">
                    <div class="tag">Срок</div>
                    <div class="tag">Вложение</div>
                    <div class="tag">Приоритет</div>
                </div>

                <div class="mic">🎤</div>

                <div class="send">➤</div>

            </div>

        </div>

    </div>

    <div class="navbar">

        <div class="nav-item">
            <div class="icon">⌂</div>
            <span>Входящие</span>
        </div>

        <div class="nav-item active">
            <div class="icon">▤</div>
            <span>Сегодня</span>
        </div>

        <div class="nav-item">
            <div class="icon">✦</div>
            <span>Привычки</span>
        </div>

        <div class="nav-item">
            <div class="icon">☰</div>
            <span>Расписание</span>
        </div>

    </div>

</div>

</body>
</html>
