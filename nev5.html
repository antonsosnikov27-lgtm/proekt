<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Привычки</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f1014;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

/* ОСНОВНОЙ ЭКРАН */
.app{
    width:100%;
    max-width:430px;
    height:100vh;
    background:linear-gradient(to bottom,#15161c,#101116);
    position:relative;
    overflow:hidden;
    border-left:1px solid #2a2a2a;
    border-right:1px solid #2a2a2a;
}

/* ПК */
@media (min-width:900px){
    body{
        padding:30px;
        background:#0b0c10;
    }

    .app{
        height:900px;
        border-radius:24px;
        box-shadow:0 0 40px rgba(0,0,0,0.7);
    }
}

/* HEADER */
.header{
    height:80px;
    padding:18px 20px;
    border-bottom:1px solid #2a2a2a;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h1{
    font-size:28px;
    font-weight:700;
}

.menu{
    width:24px;
    height:18px;
    position:relative;
}

.menu span{
    position:absolute;
    width:100%;
    height:2px;
    background:#7c7c7c;
    border-radius:10px;
    left:0;
}

.menu span:nth-child(1){top:0;}
.menu span:nth-child(2){top:8px;}
.menu span:nth-child(3){top:16px;}

/* СПИСОК */
.content{
    padding:16px 18px 120px;
}

.habit{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.circle{
    width:24px;
    height:24px;
    border:2px solid #9d9d9d;
    border-radius:50%;
    flex-shrink:0;
    margin-top:2px;
}

.habit-info{
    width:100%;
}

.habit-info p{
    color:#e5e5e5;
    font-size:18px;
    margin-bottom:14px;
}

.line{
    width:100%;
    height:1px;
    background:#2d2d2d;
}

/* КНОПКА + */
.add-btn{
    position:absolute;
    right:20px;
    bottom:92px;
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#6f63ff,#4a4dff);
    color:white;
    font-size:38px;
    font-weight:300;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(84,84,255,0.45);
}

/* НИЖНЕЕ МЕНЮ */
.bottom-nav{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:78px;
    border-top:1px solid #2a2a2a;
    background:#111217;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#8b8b8b;
    font-size:12px;
}

.nav-item svg{
    width:23px;
    height:23px;
    stroke:currentColor;
}

.nav-item.active{
    color:#4f6cff;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <h1>Привычки</h1>

        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <div class="habit">

            <div class="circle"></div>

            <div class="habit-info">
                <p>Текст</p>
                <div class="line"></div>
            </div>

        </div>

    </div>

    <!-- КНОПКА -->
    <button class="add-btn">+</button>

    <!-- NAVBAR -->
    <div class="bottom-nav">

        <div class="nav-item">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="16" rx="3"></rect>
                <line x1="8" y1="3" x2="8" y2="7"></line>
                <line x1="16" y1="3" x2="16" y2="7"></line>
            </svg>
            <span>Входящие</span>
        </div>

        <div class="nav-item">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                <rect x="4" y="4" width="16" height="16" rx="3"></rect>
                <line x1="8" y1="9" x2="16" y2="9"></line>
                <line x1="8" y1="13" x2="16" y2="13"></line>
            </svg>
            <span>Сегодня</span>
        </div>

        <div class="nav-item active">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
            </svg>
            <span>Привычки</span>
        </div>

        <div class="nav-item">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8">
                <rect x="4" y="4" width="16" height="16" rx="3"></rect>
                <line x1="8" y1="9" x2="16" y2="9"></line>
                <line x1="8" y1="13" x2="16" y2="13"></line>
            </svg>
            <span>Расписание</span>
        </div>

    </div>

</div>

</body>
</html>
