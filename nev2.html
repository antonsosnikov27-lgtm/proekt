<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Ежедневные</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b10;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
    overflow:hidden;
    padding:20px;
}

/* APP */

.app{
    width:100%;
    max-width:430px;
    height:100vh;
    max-height:940px;

    background:#111216;

    border:1px solid #1f1f26;
    border-radius:0;

    display:flex;
    flex-direction:column;

    overflow:hidden;
    position:relative;

    transition:0.3s;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 22px 20px;

    border-bottom:1px solid #23242b;
}

.title{
    font-size:52px;
    font-weight:600;
    letter-spacing:-2px;
}

.menu{
    width:42px;
    height:42px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;

    cursor:pointer;
}

.menu span{
    width:100%;
    height:2px;

    background:#8f8f96;
    border-radius:20px;

    transition:0.3s;
}

/* MENU ACTIVE */

.menu.active span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.menu.active span:nth-child(2){
    opacity:0;
}

.menu.active span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;
    padding:28px 22px 120px;
}

.content::-webkit-scrollbar{
    width:4px;
}

.content::-webkit-scrollbar-thumb{
    background:#353742;
    border-radius:10px;
}

/* TASK */

.task{
    display:flex;
    gap:16px;
    margin-bottom:24px;
}

.circle{
    width:34px;
    height:34px;

    border:2px solid #a8a8a8;
    border-radius:50%;

    flex-shrink:0;
    margin-top:4px;

    cursor:pointer;
    transition:0.3s;
}

.circle.active{
    background:linear-gradient(135deg,#5d6dff,#2e8cff);
    border-color:transparent;
}

.task-content{
    width:100%;
}

.task-content h2{
    font-size:22px;
    font-weight:400;
}

.line{
    width:100%;
    height:1px;

    background:#2c2d35;
    margin-top:24px;
}

/* BOTTOM PANEL */

.bottom-panel{
    position:relative;

    margin:0 12px 14px;

    border-radius:34px 34px 24px 24px;

    background:linear-gradient(90deg,#2486ff,#7157ff,#ff4fe1);

    padding:1px;

    min-height:350px;
}

.panel-inner{
    background:#1a1b20;

    border-radius:33px 33px 23px 23px;

    width:100%;
    height:100%;

    padding:28px 24px;

    position:relative;
}

.panel-inner h3{
    color:#72727b;
    font-size:22px;
    margin-bottom:28px;
}

.description{
    color:#6c6c74;
    font-size:20px;
    margin-bottom:40px;
}

/* TAGS */

.tags{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.tag{
    padding:12px 18px;

    border:1px solid #6d6d76;
    border-radius:12px;

    background:transparent;

    color:white;
    font-size:18px;

    cursor:pointer;
    transition:0.3s;
}

.tag:hover{
    background:#25262e;
    transform:translateY(-2px);
}

/* BUTTONS */

.mic-btn{
    position:absolute;

    right:20px;
    top:104px;

    width:58px;
    height:58px;

    border-radius:50%;
    border:none;

    background:linear-gradient(135deg,#6b5cff,#4b7dff);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 0 22px rgba(108,92,255,0.5);

    cursor:pointer;
    transition:0.3s;
}

.send-btn{
    position:absolute;

    right:18px;
    bottom:28px;

    width:82px;
    height:82px;

    border-radius:50%;
    border:none;

    background:linear-gradient(135deg,#6b5cff,#3485ff);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 0 35px rgba(88,101,242,0.6);

    cursor:pointer;
    transition:0.3s;
}

.mic-btn:hover,
.send-btn:hover{
    transform:scale(1.05);
}

/* NAVIGATION */

.bottom-nav{
    height:92px;

    background:#0d0d12;

    border-top:1px solid #1d1e26;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:6px;

    color:#d0d0d0;

    opacity:0.75;

    font-size:14px;

    cursor:pointer;
    transition:0.3s;
}

.nav-item.active{
    color:#5b7cff;
    opacity:1;
}

.nav-item:hover{
    opacity:1;
    transform:translateY(-2px);
}

.nav-item svg{
    width:28px;
    height:28px;
}

/* SVG */

svg{
    stroke:white;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* DESKTOP */

@media (min-width:1024px){

    body{
        padding:40px;
    }

    .app{
        max-width:1450px;
        width:100%;
        height:92vh;

        border-radius:32px;

        display:grid;
        grid-template-columns:1.1fr 0.9fr;
        grid-template-rows:auto 1fr auto;
    }

    .header{
        grid-column:1 / 3;

        padding:34px 38px;
    }

    .title{
        font-size:64px;
    }

    .content{
        padding:40px 38px;
    }

    .task-content h2{
        font-size:28px;
    }

    .bottom-panel{
        margin:24px;
        min-height:auto;
    }

    .panel-inner{
        padding:40px;
    }

    .panel-inner h3{
        font-size:30px;
    }

    .description{
        font-size:24px;
    }

    .bottom-nav{
        grid-column:1 / 3;
        height:100px;
    }

}

/* TABLET */

@media (max-width:1023px){

    .app{
        border-radius:28px;
    }

}

/* PHONE */

@media (max-width:480px){

    body{
        padding:0;
    }

    .app{
        max-width:100%;
        height:100vh;
        border-radius:0;
        border:none;
    }

    .header{
        padding:22px 18px 18px;
    }

    .title{
        font-size:40px;
    }

    .content{
        padding:22px 18px 110px;
    }

    .task{
        gap:14px;
    }

    .task-content h2{
        font-size:19px;
    }

    .circle{
        width:30px;
        height:30px;
    }

    .bottom-panel{
        margin:0 10px 10px;
        min-height:300px;
    }

    .panel-inner{
        padding:24px 20px;
    }

    .panel-inner h3{
        font-size:20px;
    }

    .description{
        font-size:17px;
    }

    .tag{
        font-size:15px;
        padding:10px 14px;
    }

    .mic-btn{
        width:52px;
        height:52px;
        top:96px;
    }

    .send-btn{
        width:68px;
        height:68px;
    }

    .bottom-nav{
        height:84px;
    }

    .nav-item{
        font-size:11px;
    }

    .nav-item svg{
        width:24px;
        height:24px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="title">Ежедневные</div>

        <div class="menu" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <div class="task">

            <div class="circle"></div>

            <div class="task-content">
                <h2>Текст задачи</h2>
                <div class="line"></div>
            </div>

        </div>

        <div class="task">

            <div class="circle"></div>

            <div class="task-content">
                <h2>Сделать дизайн</h2>
                <div class="line"></div>
            </div>

        </div>

        <div class="task">

            <div class="circle"></div>

            <div class="task-content">
                <h2>Проверить расписание</h2>
                <div class="line"></div>
            </div>

        </div>

    </div>

    <!-- PANEL -->

    <div class="bottom-panel">

        <div class="panel-inner">

            <h3>Название задачи</h3>

            <div class="description">
                Добавьте описание задачи или используйте ИИ помощника
            </div>

            <div class="tags">
                <button class="tag">Время</button>
                <button class="tag">Вложение</button>
                <button class="tag">Приоритет</button>
            </div>

            <!-- MIC -->

            <button class="mic-btn">

                <svg viewBox="0 0 24 24">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>

            </button>

            <!-- SEND -->

            <button class="send-btn">

                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>

            </button>

        </div>

    </div>

    <!-- NAVIGATION -->

    <div class="bottom-nav">

        <div class="nav-item active">

            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>

            <span>Ежедневные</span>

        </div>

        <div class="nav-item">

            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <line x1="8" y1="10" x2="16" y2="10"></line>
                <line x1="8" y1="14" x2="16" y2="14"></line>
            </svg>

            <span>Сегодня</span>

        </div>

        <div class="nav-item">

            <svg viewBox="0 0 24 24">
                <path d="M12 3l1.9 5.8h6.1l-4.9 3.6 1.9 5.8L12 14.6 7 18.2l1.9-5.8L4 8.8h6.1z"></path>
            </svg>

            <span>Привычки</span>

        </div>

        <div class="nav-item">

            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <line x1="8" y1="10" x2="16" y2="10"></line>
                <line x1="8" y1="14" x2="16" y2="14"></line>
                <line x1="8" y1="18" x2="13" y2="18"></line>
            </svg>

            <span>Расписание</span>

        </div>

    </div>

</div>

<script>

/* MENU */

const menuBtn = document.getElementById("menuBtn");

menuBtn.addEventListener("click", () => {
    menuBtn.classList.toggle("active");
});

/* TASK CHECK */

const circles = document.querySelectorAll(".circle");

circles.forEach(circle => {

    circle.addEventListener("click", () => {

        circle.classList.toggle("active");

    });

});

/* NAVIGATION ACTIVE */

const navItems = document.querySelectorAll(".nav-item");

navItems.forEach(item => {

    item.addEventListener("click", () => {

        navItems.forEach(nav => nav.classList.remove("active"));

        item.classList.add("active");

    });

});

/* BUTTON ANIMATION */

const sendBtn = document.querySelector(".send-btn");

sendBtn.addEventListener("click", () => {

    sendBtn.style.transform = "scale(0.9)";

    setTimeout(() => {
        sendBtn.style.transform = "scale(1)";
    }, 150);

});

/* MIC BUTTON */

const micBtn = document.querySelector(".mic-btn");

micBtn.addEventListener("click", () => {

    micBtn.style.transform = "scale(0.9)";

    setTimeout(() => {
        micBtn.style.transform = "scale(1)";
    }, 150);

});

</script>

</body>
</html>
